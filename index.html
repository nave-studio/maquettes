<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquettes de nave studio</title>
<meta name="description" content="Les maquettes de sites en cours chez nave studio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&display=swap" rel="stylesheet">
<style>
:root{
  --brume:#E4E9E7; --papier:#F3F5F3; --encre:#0F1E2B; --marine:#1F4E6B;
  --laiton:#9A6C1E; --gris:#56636D; --trait:#C7CFCC;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --brume:#0C1821; --papier:#13232F; --encre:#E3EAE7; --marine:#8FB6CF;
    --laiton:#D9A84E; --gris:#93A2AC; --trait:#24394A;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--brume); color:var(--encre);
  font-family:'Schibsted Grotesk',system-ui,-apple-system,sans-serif;
  font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.cadre{width:min(1160px,100% - 32px); margin-inline:auto}

header{padding:clamp(48px,10vw,120px) 0 clamp(32px,6vw,64px)}
h1{
  margin:0; font-weight:850; line-height:.86; letter-spacing:-.055em;
  font-size:clamp(4.2rem,17vw,12.5rem); color:var(--encre);
}
h1 .coque{
  display:block; height:clamp(10px,1.6vw,18px); margin-top:clamp(10px,2vw,22px);
  width:min(100%,10.6em); font-size:inherit;
  background:var(--marine);
  border-radius:0 0 999px 999px / 0 0 100% 100%;
}
.chapo{
  display:flex; flex-wrap:wrap; gap:8px 28px; justify-content:space-between; align-items:baseline;
  margin-top:clamp(24px,4vw,40px); max-width:60ch;
}
.chapo p{margin:0; font-size:1.15rem; color:var(--gris)}
.chapo .nombre{color:var(--encre); font-weight:600}

ol{
  list-style:none; margin:0; padding:0 0 96px;
  display:grid; gap:clamp(36px,5vw,56px) clamp(20px,3vw,36px);
  grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));
}
li a{display:block; text-decoration:none; color:inherit; border-radius:10px; outline-offset:6px}
li a:focus-visible{outline:3px solid var(--laiton)}
.vignette{
  display:block; aspect-ratio:16/10; overflow:hidden;
  background:var(--papier); border:1px solid var(--trait); border-radius:10px;
}
.vignette img{display:block; width:100%; height:100%; object-fit:cover; object-position:top}
.sans-image{display:block; height:100%}
.nom{
  display:block; margin-top:16px; font-size:1.35rem; font-weight:700; letter-spacing:-.015em; line-height:1.2;
  text-decoration:underline; text-decoration-color:transparent; text-underline-offset:5px; text-decoration-thickness:2px;
}
li a:hover .nom, li a:focus-visible .nom{text-decoration-color:var(--laiton)}
.date{display:block; margin-top:4px; color:var(--gris); font-size:.95rem}
.vide{color:var(--gris); font-size:1.15rem}

footer{border-top:1px solid var(--trait); padding:24px 0 40px; color:var(--gris); font-size:.9rem}

@media (prefers-reduced-motion:no-preference){
  .vignette img{transition:transform .5s cubic-bezier(.2,.75,.1,1)}
  li a:hover .vignette img{transform:scale(1.02)}
}
</style>
</head>
<body>
<div class="cadre">
  <header>
    <h1>nave<br>studio<span class="coque" aria-hidden="true"></span></h1>
    <div class="chapo">
      <p>Les maquettes en cours du studio. Touchez une maquette pour l'ouvrir.</p>
      <p class="nombre">1 maquette</p>
    </div>
  </header>
  <main>
    <ol>
<li><a href="pizzeria-onex/"><span class="vignette"><img src="pizzeria-onex/capture.jpg" alt="" loading="lazy" width="960" height="600"></span><span class="nom">Pizzeria della Mamma, Onex</span><span class="date">Rangée le <time datetime="2026-10-14">14 octobre 2026</time></span></a></li>
    </ol>
  </main>
  <footer>© nave studio. Maquettes de travail, à ne pas diffuser.</footer>
</div>
</body>
</html>
